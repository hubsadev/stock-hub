  <div id="userModal" class="modal fixed inset-0 bg-gray-900/50 items-center justify-center p-6 z-50">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden">
      <div class="px-6 py-5 border-b flex justify-between items-center"><div><div class="text-xs text-gray-500 font-semibold">Administration</div><h2 class="text-xl font-bold">Compte utilisateur</h2></div><button data-action="closeModal('userModal')" class="text-gray-500 hover:text-gray-900"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="p-6 overflow-y-auto flex-1 min-h-0 space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4"><label><span class="text-sm font-semibold">Identifiant</span><input id="userIdentifier" class="mt-2 w-full h-11 border rounded-lg px-3" placeholder="Ex : k.hermann" autocomplete="username"></label><label><span class="text-sm font-semibold">Email de contact</span><input id="userEmail" class="mt-2 w-full h-11 border rounded-lg px-3" placeholder="Optionnel"></label><label><span class="text-sm font-semibold">Prenom</span><input id="userFirstName" class="mt-2 w-full h-11 border rounded-lg px-3" placeholder="Prenom utilisateur"></label><label><span class="text-sm font-semibold">Nom</span><input id="userLastName" class="mt-2 w-full h-11 border rounded-lg px-3" placeholder="Nom utilisateur"></label><label><span class="text-sm font-semibold">Statut</span><select id="userActive" class="mt-2 w-full h-11 border rounded-lg px-3"><option value="">Selectionner</option><option value="true">Actif</option><option value="false">Inactif</option></select></label></div>
        <div class="border rounded-xl overflow-hidden"><div class="px-5 py-4 bg-gray-50 border-b"><h3 class="font-bold">Roles</h3><p class="text-sm text-gray-500 mt-1">Un utilisateur peut avoir plusieurs roles si besoin.</p></div><div class="p-5 flex flex-wrap gap-3 text-sm font-semibold"><label class="px-3 py-2 border rounded-full"><input name="userRole" value="ADMIN_STOCK" type="checkbox"> Admin Stock</label><label class="px-3 py-2 border rounded-full"><input name="userRole" value="GESTIONNAIRE_STOCK" type="checkbox"> Gestionnaire stock</label><label class="px-3 py-2 border rounded-full"><input name="userRole" value="AUDIT" type="checkbox"> Audit</label><label class="px-3 py-2 border rounded-full"><input name="userRole" value="DIRECTION" type="checkbox"> Direction</label><label class="px-3 py-2 border rounded-full"><input name="userRole" value="RH" type="checkbox"> RH</label><label class="px-3 py-2 border rounded-full"><input name="userRole" value="CHEF_PROJET" type="checkbox"> Chef projet</label></div></div>
        <div class="border rounded-xl overflow-hidden"><div class="px-5 py-4 bg-gray-50 border-b"><h3 class="font-bold">Securite</h3><p class="text-sm text-gray-500 mt-1">Mot de passe initial ou reinitialisation.</p></div><div class="p-5 grid grid-cols-1 md:grid-cols-[1fr_auto] gap-3"><div class="flex rounded-lg border border-gray-300 overflow-hidden"><input id="userPassword" type="password" class="w-full h-11 px-3 outline-none" placeholder="Nouveau mot de passe"><button type="button" data-action="toggleUserPassword()" class="w-12 border-l text-gray-500 flex items-center justify-center"><i id="userPasswordIcon" data-lucide="eye" class="w-4 h-4"></i></button></div><button class="h-11 px-4 rounded-lg border font-semibold">Reinitialiser</button></div></div>
      </div>
      <div class="px-6 py-4 border-t flex justify-end gap-3"><button data-action="closeModal('userModal')" class="px-4 py-2 bg-white border rounded-lg font-semibold">Annuler</button><button data-action="submitUser" class="px-4 py-2 bg-accent-600 text-white rounded-lg font-semibold">Enregistrer utilisateur</button></div>
    </div>
  </div>
