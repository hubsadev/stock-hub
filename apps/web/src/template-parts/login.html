<div id="loginOverlay" class="fixed inset-0 z-[100] bg-gray-50 flex items-center justify-center p-6">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,_#e0e7ff,_transparent_35%),radial-gradient(circle_at_bottom_right,_#dcfce7,_transparent_30%)]"></div>
    <div class="relative bg-white border border-gray-200 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
      <div class="p-7 border-b border-gray-100">
        <div class="flex items-center gap-3 text-accent-600 font-bold text-2xl">
          <i data-lucide="layers" class="w-7 h-7"></i>
          <span>Stock Hub</span>
        </div>
        <div class="mt-7">
          <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Acces stock & audit</div>
          <h1 class="text-3xl font-bold mt-2">Connexion</h1>
          <p class="text-sm text-gray-500 mt-2">Connecte-toi avec un compte Stock Hub actif.</p>
        </div>
      </div>
      <div class="p-7 space-y-4">
        <label class="block"><span class="text-sm font-semibold text-gray-700">Email</span><input id="loginEmail" class="mt-2 w-full h-11 rounded-lg border border-gray-300 px-3" placeholder="email@stock.local" autocomplete="username"></label>
        <label class="block"><span class="text-sm font-semibold text-gray-700">Mot de passe</span><div class="mt-2 flex rounded-lg border border-gray-300 overflow-hidden bg-white"><input id="loginPassword" type="password" class="w-full h-11 px-3 outline-none" placeholder="Mot de passe" autocomplete="current-password"><button type="button" data-action="toggleLoginPassword()" class="w-12 border-l border-gray-200 text-gray-500 flex items-center justify-center"><i id="loginPasswordIcon" data-lucide="eye" class="w-4 h-4"></i></button></div></label>
        <div id="loginError" class="hidden rounded-lg border border-error-100 bg-error-50 px-3 py-2 text-sm font-semibold text-error-700"></div><button data-action="loginUser()" class="w-full h-12 rounded-xl bg-accent-600 text-white font-bold flex items-center justify-center gap-2"><i data-lucide="log-in" class="w-4 h-4"></i>Se connecter</button>
      </div>
    </div>
  </div>
