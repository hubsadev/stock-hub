services:
  postgres:
    image: postgres:17-alpine
    container_name: stock-hub-postgres
    environment:
      POSTGRES_DB: stock_hub_dev
      POSTGRES_USER: stock_hub
      POSTGRES_PASSWORD: stock_hub
    ports:
      - "55433:5432"
    volumes:
      - stock_hub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_hub -d stock_hub_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stock_hub_postgres_data: